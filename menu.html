<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | CURV</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.thecurv.cafe/menu/">
  <link rel="icon" type="image/png" href="/favicon1.png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f5f0; color: #212842; font-family: Arial, sans-serif; }
    main { padding: 24px; text-align: center; }
    a { color: #212842; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p>Opening the CURV menu...</p>
    <a id="legacyRedirectLink" href="/menu/">Continue to the menu</a>
  </main>
  <script>
    (() => {
      const destination = '/menu/' + window.location.search + window.location.hash;
      document.getElementById('legacyRedirectLink').href = destination;
      window.location.replace(destination);
    })();
  </script>
</body>
</html>
